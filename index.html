    rimLight:'Rim', coreLight:'Core', sweepLight:'Sweep', solidShape:'Solid', regular:'Regular N-face', irregular:'Irregular', sphere:'Sphere',
    faces:'Faces', symmetry:'Symmetry', frame:'Frame', on:'On', off:'Off', demoControls:'Demo controls', switchEngine:'Switch engine',
    dynamicSand:'Dynamic Sand', modalSand:'Modal Sand', cosmicWeb:'Cosmic Web', dynamicCosmic:'Dynamic Cosmic', randomPattern:'Random pattern',
    enterFullscreen:'Enter fullscreen', exitFullscreen:'Exit fullscreen', pauseRotation:'Pause rotation', resumeRotation:'Resume rotation',
    switchLanguage:'切换到中文', sourceCode:'View source on GitHub'
  }
};
function textFor(key){ return (copy[lang]&&copy[lang][key])||copy.zh[key]||key; }
function syncToggleLabels(){
  document.querySelectorAll('[data-toggle]').forEach(function(btn){ btn.textContent=textFor(btn.dataset.on==='true'?'on':'off'); });
}
function applyLanguage(next){
  lang=next==='en'?'en':'zh';
  document.documentElement.lang=lang==='zh'?'zh-CN':'en';
  document.querySelectorAll('[data-i18n]').forEach(function(el){ el.textContent=textFor(el.dataset.i18n); });
  document.querySelectorAll('[data-i18n-aria]').forEach(function(el){ el.setAttribute('aria-label',textFor(el.dataset.i18nAria)); });
  document.querySelectorAll('[data-i18n-title]').forEach(function(el){ el.title=textFor(el.dataset.i18nTitle); });
  var description=document.querySelector('meta[name="description"]');
  if(description) description.content=textFor('description');
  var langBtn=document.getElementById('langBtn');
  langBtn.textContent=lang==='zh'?'EN':'中';
  langBtn.title=textFor('switchLanguage');
  langBtn.setAttribute('aria-label',textFor('switchLanguage'));
  syncToggleLabels();
  syncFullscreenButton();
  syncSpinButton();
  try{ localStorage.setItem('chladni-web-lang',lang); }catch(e){}
}
document.getElementById('langBtn').addEventListener('click',function(){ applyLanguage(lang==='zh'?'en':'zh'); });
function send(method,args){
  try{
    var bridge=frame.contentWindow.soundMotionNative, fn=bridge&&bridge[method];
    if(typeof fn==='function') return fn.apply(bridge,args||[]);   // same-origin direct call preserves the click needed for audio playback
    frame.contentWindow.postMessage({type:'call',method:method,args:args||[]},'*');
  }catch(e){}
}
function syncDetailControl(){
  var value=detailByStyle[currentStyle];
  document.querySelector('input[data-param="detail"]').value=String(value);
  document.getElementById('val-detail').textContent=value.toFixed(2)+'×';
}

requestAnimationFrame(function(){
  document.getElementById('hero').classList.add('in');
  document.getElementById('dock').classList.add('in');
});

/* The engine owns the captured default pattern so the showcase and offline exports cannot drift. */
frame.addEventListener('load',function(){
  send('applyWebDefaultPattern',['cosmic']);
  send('setRotationMode',['precess']);
});

document.querySelectorAll('.dock-styles button').forEach(function(btn){
  btn.addEventListener('click',function(){
    document.querySelectorAll('.dock-styles button').forEach(function(b){ b.setAttribute('aria-pressed', String(b===btn)); });
    currentStyle=btn.dataset.style;
    syncDetailControl();
    if(btn.dataset.style==='sand'||btn.dataset.style==='dcosmic') send('playDemo');
    send('setStyle',[btn.dataset.style]);
    if(btn.dataset.style!=='sand'&&btn.dataset.style!=='dcosmic') send('stop');
  });
});

document.getElementById('rerollBtn').addEventListener('click',function(){ send('randomizePattern'); });

var fullscreenBtn=document.getElementById('fullscreenBtn');
function fullscreenElement(){ return document.fullscreenElement||document.webkitFullscreenElement; }
function exitFullscreen(){
  var result=document.exitFullscreen?document.exitFullscreen():document.webkitExitFullscreen&&document.webkitExitFullscreen();
  if(result&&result.catch) result.catch(function(e){ console.error('fullscreen exit failed',e); });
}
function syncFullscreenButton(){
  var on=Boolean(fullscreenElement()), label=textFor(on?'exitFullscreen':'enterFullscreen');
  document.body.classList.toggle('fullscreen-clean',on);
  if(on){ document.getElementById('settingsPanel').hidden=true; document.getElementById('settingsBtn').setAttribute('aria-pressed','false'); }
  fullscreenBtn.setAttribute('aria-pressed',String(on)); fullscreenBtn.setAttribute('aria-label',label); fullscreenBtn.title=label;
}
fullscreenBtn.addEventListener('click',function(){
  var root=document.documentElement, result;
  if(fullscreenElement()){ exitFullscreen(); return; }
  else result=root.requestFullscreen?root.requestFullscreen():root.webkitRequestFullscreen&&root.webkitRequestFullscreen();
  if(result&&result.catch) result.catch(function(e){ console.error('fullscreen failed',e); });
});
document.addEventListener('fullscreenchange',syncFullscreenButton);
document.addEventListener('webkitfullscreenchange',syncFullscreenButton);

var spinning=true, spinBtn=document.getElementById('spinBtn');
function syncSpinButton(){
  spinBtn.textContent=spinning?'❚❚':'▶';
  spinBtn.setAttribute('aria-pressed', String(spinning));
  spinBtn.setAttribute('aria-label', textFor(spinning?'pauseRotation':'resumeRotation'));
  spinBtn.title=textFor(spinning?'pauseRotation':'resumeRotation');
}
function setSpinning(on){
  if(spinning===on){ syncSpinButton(); return; }
  spinning=on;
  syncSpinButton();
  send('setBoolean',['rotation',spinning]);
}
spinBtn.addEventListener('click',function(){ setSpinning(!spinning); });

/* drag-to-orbit: a transparent layer above the iframe forwards pointer deltas to the engine's
   dragRotate bridge method, reusing its exact trackball math. Most useful once paused, to
   inspect a still pattern from any angle — so a drag also stops the auto-spin, like the
   in-app Cmd+drag does. */
var dragLayer=document.getElementById('dragLayer');
var dragging=false, dragLastX=0, dragLastY=0;
dragLayer.addEventListener('pointerdown',function(e){
  if(e.button!==0) return;
  dragging=true; dragLastX=e.clientX; dragLastY=e.clientY;
  dragLayer.classList.add('grabbing');
  dragLayer.setPointerCapture(e.pointerId);
  setSpinning(false);
});
dragLayer.addEventListener('pointermove',function(e){
  if(!dragging) return;
  var dx=e.clientX-dragLastX, dy=e.clientY-dragLastY;
  dragLastX=e.clientX; dragLastY=e.clientY;
  send('dragRotate',[dx,dy]);
});
function endDrag(){ dragging=false; dragLayer.classList.remove('grabbing'); }
dragLayer.addEventListener('pointerup',endDrag);
dragLayer.addEventListener('pointercancel',endDrag);

/* ── advanced settings: every control here maps 1:1 onto the real engine's own
   setParam/setBoolean/setRotationMode/setSolidShape bridge — nothing here is
   re-implemented, so values always match what the real app would do with them. */
var settingsBtn=document.getElementById('settingsBtn'), settingsPanel=document.getElementById('settingsPanel');
function setSettingsOpen(open){
  settingsPanel.hidden=!open;
  settingsBtn.setAttribute('aria-pressed', String(open));
}
settingsBtn.addEventListener('click',function(){ setSettingsOpen(settingsPanel.hidden); });
document.getElementById('closeSettingsBtn').addEventListener('click',function(){ setSettingsOpen(false); });
document.addEventListener('keydown',function(e){ if(e.key==='Escape'){ setSettingsOpen(false); if(fullscreenElement())exitFullscreen(); } });
document.addEventListener('click',function(e){
  if(!settingsPanel.hidden && !settingsPanel.contains(e.target) && !settingsBtn.contains(e.target)) setSettingsOpen(false);
});

function wireSeg(selector,onSelect){
  var group=document.querySelector(selector);
  group.querySelectorAll('button').forEach(function(btn){
    btn.addEventListener('click',function(){
      group.querySelectorAll('button').forEach(function(b){ b.setAttribute('aria-pressed', String(b===btn)); });
      onSelect(btn.dataset.value);
    });
  });
}
wireSeg('[data-control="rotmode"]', function(v){ send('setRotationMode',[v]); });
wireSeg('[data-control="light"]', function(v){ send('setParam',['light', Number(v)]); });

var solidShape='regular', solidFaces=8;
wireSeg('[data-control="solidshape"]', function(v){ solidShape=v; send('setSolidShape',[solidShape,solidFaces,false]); });

function wireRange(param,formatter){
  var el=document.querySelector('input[data-param="'+param+'"]');
  var out=document.getElementById('val-'+param);
  el.addEventListener('input',function(){
    var v=parseFloat(el.value);
    out.textContent=formatter(v);
    if(param==='detail') detailByStyle[currentStyle]=v;
    if(param==='faces'){ solidFaces=Math.round(v); send('setSolidShape',[solidShape,solidFaces,false]); }
    else send('setParam',[param,v]);
  });
}
wireRange('rotationSpeed', function(v){ return v.toFixed(2); });
wireRange('zoom', function(v){ return (v<1?v.toFixed(2):v.toFixed(1))+'×'; });
wireRange('detail', function(v){ return v.toFixed(2)+'×'; });
wireRange('particles', function(v){ return Math.round(v*100)+'%'; });
wireRange('faces', function(v){ return String(Math.round(v)); });

function wireToggle(name,selector){
  var btn=document.querySelector(selector), on=btn.dataset.on==='true';
  btn.addEventListener('click',function(){
    on=!on;
    btn.dataset.on=String(on);
    btn.setAttribute('aria-pressed', String(on));
    btn.textContent=textFor(on?'on':'off');
    send('setBoolean',[name,on]);
  });
}
wireToggle('symmetry','[data-toggle="symmetry"]');
wireToggle('frame','[data-toggle="frame"]');
applyLanguage(lang);
})();
</script>
</body>
</html>
