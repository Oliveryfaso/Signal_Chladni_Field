name: Release downloads

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check sources
        run: npm run check

      - name: Build release downloads
        run: npm run release:artifacts -- "$RUNNER_TEMP/release"

      - name: Verify checksums
        run: cd "$RUNNER_TEMP/release" && shasum -a 256 -c SHA256SUMS.txt

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "$RUNNER_TEMP/release/"* --clobber
          else
            gh release create "$GITHUB_REF_NAME" "$RUNNER_TEMP/release/"* \
              --verify-tag \
              --latest \
              --generate-notes \
              --title "Signal Field $GITHUB_REF_NAME"
          fi
